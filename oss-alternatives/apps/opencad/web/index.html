     时间戳形态 = 站级口径 YYYY-MM-DDTHH:MM:SS+08:00（ops/web-footer-timestamp）。 -->
<meta name="app-version" content="2026.10.06">
<meta name="build-stamp" content="2026-10-06T16:10:00+08:00">
<!-- 页签标题：静态兜底 = 三语词典 app.title 的 en 值，boot 后由 app.js fillI18n 按 strings["app.title"]
     覆盖。标题元素上的 i18n 绑定是承重的：裸字面量会被 CAD_UI_VERDICT 的 human_literals 腿计入
     （判据 ui_gate.py `_html_literals`：带 i18n 绑定的元素不计字面量），而空 <title> 顶红
     WEB_PAGE_AUDIT 的 aria.doc_title 腿（判据 page_audit.py:1206）—— 两条腿同时绿只此一形。 -->
<title data-i18n="app.title">Open Engineering CAD</title>
<!-- 页面级元信息：description + Open Graph（社交/搜索卡片用；页内可见文案那份在 body，两者互不覆盖）。
     三态纪律（"没有"不许写成"有"）：og:url / og:image 要**线上绝对地址**，本服务线上地址还没定，
     且本文件不许出现 http(s) 字面量（tests/test_server.py 的静态面判据 + ui_gate 的 external_refs
     腿都禁外链）⇒ 这两条**不写**，不编地址；线上地址定了再加。
     description 只此一份英文：页内文案由 app.js 按语言重填，而 meta 不参与那套重刷
     —— 这里不假装它是三语的。 -->
<meta name="description" content="Open Engineering CAD — browser 2D drafting shell: draw, dimension and snap on the canvas, export DXF / PDF, and run fully offline on local assets only.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="OpenCAD">

<meta property="og:locale:alternate" content="ja_JP">

<!--
  OpenCAD 线上 Web 外壳的静态骨架（原生 HTML/CSS/JS：无框架、无 CDN、无任何外部资源）。
  区域地图（本页真实具备的能力，按区域给可访问名；三态纪律：没有的能力不假装有）：
    #topbar   顶栏：h1 应用名 + #toolbar 工具栏 + #actions 文件与导出 + #selectors 语言/标准档
    #workspace 工作区： #canvas-pane 画布（#canvas + 捕捉指示 + 动态输入）
                        #side-pane  参数面板（图层 / 标准档与投影角 / 精度设置 DSETTINGS）
    #bottom   命令与状态： #status 状态读数（其中 .seg--message 是唯一的 live region）+ #cmd-line 命令行
  三视图（主视/俯视/右视/轴测的交互式切换）**不在本外壳能力面内**：本页是 2D 制图外壳，
  /api 无对应命令、app.js 无对应接线；语言包里的 cmd.view.* 是 cadcore.draw.sheet 的**出图方向**
  （packages/cadcore/cadcore/draw/sheet.py:156-159），不是本页的视图开关。故本页不摆死按钮。
  文本策略：每个面向用户的文本节点都带 data-i18n="<key>"（含 <title>：静态兜底文本与键同批出现），
  由 app.js 从 /api/state strings 填充、切语言时整页重填。只留裸字面量会顶红 CAD_UI_VERDICT 的
  human_literals 腿（ui_gate 的 _html_literals 跳过带 i18n 绑定的元素），只留空壳则顶红
  WEB_PAGE_AUDIT 的 aria.doc_title 腿 —— 两条腿同时绿只有"绑定 + 兜底文本"这一形。
  可访问名策略：图标/无文字控件用 data-i18n-title="<key>"（app.js:143 写 title 属性）。
  唯一例外 #cmd-line 用静态 aria-label="Command line"：WEB_PAGE_AUDIT 的 aria.control_name 腿只认
  文本/aria-label/labelledby/i18n 键（title 属性在 accname 里只算描述），三语词典没有"命令行"词条、
  也没有可当名字的现成元素，且它落在页脚 flex 行里（加可见 <label> 会动布局）
  ⇒ 先落静态名把门修绿；等词典补键或 app.js 支持键驱动的 aria-label 填充后再换。
  服务外壳（待接线，不是遗漏）：d6 的 /web/js/shell.js 注入 infra 级顶栏（服务互链 + 回主页），
  它自述"不会自己被加载"，必须由本页接线；但该文件当前自带 5 个 https 字面量与 198 个 CJK 字符，
  会顶红 CAD_UI_VERDICT 的 external_refs / human_literals 两条承重腿（逐文件量化见 d1 REPORT），
  故先回滚这一行，等它改件或门改腿后由 s14_wire_shell.py 一条命令重放。
-->

      <svg class="tool__glyph" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16c0-6 4-10 8-10"></path><path d="M20 8c0 6-4 10-8 10"></path><circle cx="12" cy="12" r="1.5"></circle></svg>
    </button>
    <button class="tool" type="button" data-tool="osnap" data-i18n="cmd.osnap" data-i18n-title="cmd.osnap" aria-pressed="false">
      <svg class="tool__glyph" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v3M12 17v3M4 12h3M17 12h3"></path><rect x="8.5" y="8.5" width="7" height="7" rx="1"></rect></svg>
    </button>
    <button class="tool" type="button" data-tool="snap" data-i18n="cmd.snap" data-i18n-title="cmd.snap" aria-pressed="false">
      <svg class="tool__glyph" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z" stroke-dasharray="2.5 2.5"></path><path d="M9 9h6v6H9z"></path><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg>
    </button>
    <button class="tool" type="button" data-tool="dyn" data-i18n="cmd.dyn" data-i18n-title="cmd.dyn" aria-pressed="false">
      <svg class="tool__glyph" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="8" width="17" height="8" rx="1.5"></rect><path d="M7 12h10"></path><path d="M9 10.5v3M15 10.5v3"></path></svg>
    </button>
    <button class="tool" type="button" data-tool="otrack" data-i18n="cmd.otrack" data-i18n-title="cmd.otrack" aria-pressed="false">
      <svg class="tool__glyph" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16" stroke-dasharray="3 2.5"></path><path d="M12 4v16" stroke-dasharray="3 2.5"></path><circle cx="12" cy="12" r="2"></circle><circle cx="4" cy="12" r="1.2"></circle><circle cx="12" cy="4" r="1.2"></circle></svg>
    </button>
  </div>

  <div id="actions" role="group" data-i18n-title="menu.file">
    <button class="action" type="button" data-action="open" data-i18n="cmd.open" data-i18n-title="cmd.open"></button>
    <button class="action" type="button" data-action="save" data-i18n="cmd.save" data-i18n-title="cmd.save"></button>
    <button class="action" type="button" data-action="export-dxf" data-i18n="cmd.export.dxf" data-i18n-title="cmd.export.dxf"></button>
    <button class="action" type="button" data-action="export-pdf" data-tool="export_pdf" data-i18n="cmd.export.pdf" data-i18n-title="cmd.export.pdf"></button>
    <button class="action" type="button" data-action="zoom-fit" data-i18n="cmd.zoom_fit" data-i18n-title="cmd.zoom_fit"></button>
  </div>

  <div id="selectors">
    <label class="field" for="lang-select">
      <span class="field__label" data-i18n="dlg.field.language"></span>
      <select id="lang-select"></select>
    </label>
    <label class="field" for="standard-select">
      <span class="field__label" data-i18n="dlg.field.standard"></span>
      <select id="standard-select"></select>
    </label>
  </div>
</header>

<main id="workspace">
  <section id="canvas-pane">
    <canvas id="canvas" data-i18n-title="canvas.label"></canvas>
    <div id="snap-indicator" class="snap-indicator" aria-hidden="true" hidden></div>
    <div id="dyn-input" class="dyn-input" hidden>
      <label class="dyn-input__field"><span data-i18n="dyn.length"></span>
        <input id="dyn-length" type="text" inputmode="decimal" autocomplete="off"></label>
      <label class="dyn-input__field"><span data-i18n="dyn.angle"></span>
        <input id="dyn-angle" type="text" inputmode="decimal" autocomplete="off"></label>
    </div>
  </section>
  <aside id="side-pane" aria-labelledby="side-pane-title">
    <h2 class="pane__title" id="side-pane-title" data-i18n="panel.layers"></h2>
    <ul id="layers"></ul>
    <dl id="profile">
      <dt data-i18n="tb.standard"></dt>
      <dd id="profile-standard"></dd>
      <dt data-i18n="tb.projection"></dt>
      <dd id="profile-projection"></dd>
    </dl>
    <details id="precision-panel" class="precision">
      <summary id="precision-store" data-i18n="panel.drafting"></summary>
      <div class="precision__block">
        <h3 class="precision__title" data-i18n="panel.osnap_kinds"></h3>
        <ul id="osnap-kinds" class="precision__list"></ul>
      </div>
      <div class="precision__block">
        <h3 class="precision__title" data-i18n="panel.priority"></h3>
        <ul id="osnap-priority" class="precision__list"></ul>
      </div>
      <div class="precision__block">
        <label class="precision__field" for="osnap-tolerance">
          <span data-i18n="panel.tolerance"></span>
          <input id="osnap-tolerance" type="text" inputmode="decimal" autocomplete="off">
        </label>
        <button class="precision__apply" type="button" data-precision-apply="tolerance" data-i18n="panel.apply"></button>
      </div>
      <div class="precision__block">
        <label class="precision__field" for="grid-spacing">
          <span data-i18n="panel.grid_step"></span>
          <input id="grid-spacing" type="text" inputmode="decimal" autocomplete="off">
        </label>
        <button class="precision__apply" type="button" data-precision-apply="spacing" data-i18n="panel.apply"></button>
      </div>
      <div class="precision__block">
        <label class="precision__field" for="polar-increments">
          <span data-i18n="panel.polar_increments"></span>
          <input id="polar-increments" type="text" autocomplete="off">
        </label>
        <button class="precision__apply" type="button" data-precision-apply="increments" data-i18n="panel.apply"></button>
      </div>
      <div class="precision__block">
        <label class="precision__field" for="ignore-hatch">
          <span data-i18n="panel.ignore_hatch"></span>
          <input id="ignore-hatch" type="checkbox">
        </label>
      </div>
      <div class="precision__block">
        <label class="precision__field" for="hatch-pattern">
          <span data-i18n="panel.pattern"></span>
          <select id="hatch-pattern"></select>
        </label>
        <label class="precision__field" for="hatch-spacing">
          <span data-i18n="panel.hatch_spacing"></span>
          <input id="hatch-spacing" type="text" inputmode="decimal" autocomplete="off">
        </label>
        <button class="precision__apply" type="button" data-precision-apply="hatch" data-i18n="panel.apply"></button>
      </div>
    </details>
  </aside>
</main>

<footer id="bottom">
  <div id="status">
    <span class="seg" data-seg="language">
      <span class="seg__label" data-i18n="dlg.field.language"></span>
      <span class="seg__value" id="status-language"></span>
    </span>
    <span class="seg" data-seg="standard">
      <span class="seg__label" data-i18n="tb.standard"></span>
      <span class="seg__value" id="status-standard"></span>
    </span>
    <span class="seg" data-seg="projection">
      <span class="seg__label" data-i18n="tb.projection"></span>
      <span class="seg__value" id="status-projection"></span>
    </span>
    <span class="seg" data-seg="entities">
      <span class="seg__label" data-i18n="status.entities"></span>
      <span class="seg__value" id="status-entities"></span>
    </span>
    <span class="seg" data-seg="cursor">
      <span class="seg__label" data-i18n="status.cursor"></span>
      <span class="seg__value" id="status-cursor"></span>
    </span>
    <span class="seg" data-seg="tool">
      <span class="seg__label" data-i18n="status.tool"></span>
      <span class="seg__value" id="status-tool"></span>
    </span>
    <span class="seg" data-seg="snap">
      <span class="seg__label" data-i18n="status.snap"></span>
      <span class="seg__value" id="status-snap"></span>
    </span>
    <span class="seg" data-seg="ortho">
      <span class="seg__label" data-i18n="status.ortho"></span>
      <span class="seg__value" id="status-ortho"></span>
    </span>
    <span class="seg" data-seg="polar">
      <span class="seg__label" data-i18n="status.polar"></span>
      <span class="seg__value" id="status-polar"></span>
    </span>
    <span class="seg" data-seg="osnap">
      <span class="seg__label" data-i18n="status.osnap"></span>
      <span class="seg__value" id="status-osnap"></span>
    </span>
    <span class="seg" data-seg="dyn">
      <span class="seg__label" data-i18n="status.dyn"></span>
      <span class="seg__value" id="status-dyn"></span>
    </span>
    <span class="seg" data-seg="grid">
      <span class="seg__label" data-i18n="status.grid"></span>
      <span class="seg__value" id="status-grid"></span>
    </span>
    <span class="seg" data-seg="readout">
      <span class="seg__label" data-i18n="status.readout"></span>
      <span class="seg__value" id="status-readout"></span>
    </span>
    <span class="seg" data-seg="measure">
      <span class="seg__label" data-i18n="status.measure"></span>
      <span class="seg__value" id="status-measure"></span>
    </span>
    <span class="seg seg--message" data-seg="message" role="status" aria-live="polite">
      <span class="seg__value" id="status-message"></span>
    </span>
  </div>
  <input id="cmd-line" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
         aria-label="Command line" data-i18n-placeholder="cmd.line" data-i18n-title="cmd.hint">
</footer>

<script src="web/js/app.js"></script>
</body>
</html>
